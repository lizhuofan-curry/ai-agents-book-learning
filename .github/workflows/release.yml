name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive versioned source
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="ai-agents-book-learning-${GITHUB_REF_NAME}/" --output="dist/ai-agents-book-learning-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
