[project]
name = "ai-agents-book-learning"
version = "0.1.0"
description = "AI Agents Book local learning workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.68,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[dependency-groups]
chapter1 = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pypdf>=4,<7",
    "reportlab>=4,<5",
    "tabulate>=0.9,<1",
]

[tool.uv]
package = false
default-groups = ["chapter1"]
