[project]
name = "ai-agents-book-learning"
version = "0.1.0"
description = "AI Agents Book local learning workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "networkx>=3.6.1,<4",
    "openai>=1.68,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
chapter1 = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pypdf>=4,<7",
    "reportlab>=4,<5",
    "tabulate>=0.9,<1",
]
chapter2 = [
    "defusedxml>=0.7,<1",
    "python-pptx>=1.0,<2",
    "torch>=2.7,<3",
    "transformers>=4.51,<5",
]
chapter3-index = [
    "annoy==1.17.3",
    "colorlog==6.8.0",
    "hnswlib==0.8.0",
]

[tool.uv]
package = false
default-groups = ["chapter1", "chapter2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
