<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transformer 论文 · 页面稿预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#20334e;font-family:"Microsoft YaHei",sans-serif}
header,main{max-width:1008px;margin:auto;padding:24px}header{padding-bottom:0}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7;color:#52657c}
nav{display:flex;gap:8px;flex-wrap:wrap}a{color:#245a95}nav a{background:white;padding:6px 12px;border-radius:5px;text-decoration:none}
section{margin-bottom:28px;scroll-margin-top:16px}h2{font-size:16px;display:flex;justify-content:space-between;align-items:center}h2 a{font-size:13px;font-weight:normal}
.frame{width:100%;aspect-ratio:16/9;overflow:hidden;background:white;box-shadow:0 3px 16px #20334e18}
iframe{border:0;width:960px;height:540px;transform-origin:top left;display:block}
</style>
</head>
<body>
<header><h1>Transformer 论文 · 页面稿预览</h1><p>本次已保存的 13 页 HTML 页面稿。最终 PPT 尚未生成，转换后的排版还需检查。</p><nav id="nav"></nav></header>
<main id="pages"></main>
<script>
const base='./运行结果/20261011_230413_765250/slides/';
for(let n=1;n<=13;n++){
  const src=base+'slide'+String(n).padStart(2,'0')+'.html';
  const nav=document.createElement('a');nav.href='#page'+n;nav.textContent=n;document.querySelector('#nav').append(nav);
  const section=document.createElement('section');section.id='page'+n;
  const heading=document.createElement('h2');heading.textContent='第 '+n+' 页';
  const link=document.createElement('a');link.href=src;link.target='_blank';link.rel='noopener';link.textContent='单独打开';heading.append(link);
  const wrapper=document.createElement('div');wrapper.className='frame';
  const frame=document.createElement('iframe');frame.src=src;frame.title='第 '+n+' 页';frame.loading='lazy';wrapper.append(frame);section.append(heading,wrapper);document.querySelector('#pages').append(section);
}
const resize=new ResizeObserver(entries=>{for(const entry of entries)entry.target.firstElementChild.style.transform='scale('+entry.contentRect.width/960+')'});
document.querySelectorAll('.frame').forEach(element=>resize.observe(element));
</script>
</body>
</html>
