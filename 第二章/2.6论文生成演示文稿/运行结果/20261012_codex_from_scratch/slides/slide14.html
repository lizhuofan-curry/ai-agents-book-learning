<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>html{background:#fff;}body{width:720pt;height:405pt;margin:0;padding:0;display:flex;position:relative;background:#fff;font-family:Arial,sans-serif;color:#17324d;}*{box-sizing:border-box;}h1{font-size:31pt;line-height:1.18;margin:0;}h2{font-size:21pt;line-height:1.3;margin:0;}p{font-size:18pt;line-height:1.35;margin:0 0 12pt;}ul{font-size:18pt;line-height:1.4;margin:0;padding-left:20pt;}li{margin-bottom:13pt;}img,.area{position:absolute;}img{object-fit:contain;}.label{font-size:16pt;color:#126d87;font-weight:bold;margin:0 0 9pt;}.lead{font-size:22pt;line-height:1.3;}.small{font-size:15pt;line-height:1.45;}.tiny{font-size:13pt;line-height:1.4;}.muted{color:#64748b;font-size:18pt;}.formula{font-size:20pt;line-height:1.35;}.metric{font-size:39pt;color:#126d87;font-weight:bold;line-height:1;margin-bottom:8pt;}.title{position:absolute;left:34pt;top:30pt;width:652pt;height:66pt;}.foot{position:absolute;left:34pt;top:379pt;width:620pt;font-size:10pt;color:#64748b;line-height:1;}.page{position:absolute;left:671pt;top:379pt;font-size:10pt;color:#64748b;line-height:1;}</style></head><body><div class="title"><h1>贡献与适用边界</h1></div><div class="area" style="left:34pt;top:110pt;width:650pt;height:240pt;"><p class="label">主要贡献</p><ul><li>用多头注意力组织编码器—解码器，减少循环计算。</li><li>在论文机器翻译任务上取得较高BLEU，并报告较低训练成本。</li></ul><p class="label">需要保留的边界</p><ul><li>全局注意力随序列长度呈二次复杂度增长。</li><li>训练并行不代表自回归推理完全并行。</li><li>结果属于论文任务与训练设置，不能直接外推到所有任务。</li></ul></div><p class="foot">来源：Vaswani 等，Attention Is All You Need，PDF第2、6–10页，§7</p><p class="page">14</p></body></html>
