<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>html{background:#fff;}body{width:720pt;height:405pt;margin:0;padding:0;display:flex;position:relative;background:#fff;font-family:Arial,sans-serif;color:#17324d;}*{box-sizing:border-box;}h1{font-size:31pt;line-height:1.18;margin:0;}h2{font-size:21pt;line-height:1.3;margin:0;}p{font-size:18pt;line-height:1.35;margin:0 0 12pt;}ul{font-size:18pt;line-height:1.4;margin:0;padding-left:20pt;}li{margin-bottom:13pt;}img,.area{position:absolute;}img{object-fit:contain;}.label{font-size:16pt;color:#126d87;font-weight:bold;margin:0 0 9pt;}.lead{font-size:22pt;line-height:1.3;}.small{font-size:15pt;line-height:1.45;}.tiny{font-size:13pt;line-height:1.4;}.muted{color:#64748b;font-size:18pt;}.formula{font-size:20pt;line-height:1.35;}.metric{font-size:39pt;color:#126d87;font-weight:bold;line-height:1;margin-bottom:8pt;}.title{position:absolute;left:34pt;top:30pt;width:652pt;height:66pt;}.foot{position:absolute;left:34pt;top:379pt;width:620pt;font-size:10pt;color:#64748b;line-height:1;}.page{position:absolute;left:671pt;top:379pt;font-size:10pt;color:#64748b;line-height:1;}</style></head><body><div class="title"><h1>位置信息与前馈网络</h1></div><div class="area" style="left:34pt;top:110pt;width:650pt;height:240pt;"><p class="label">位置编码</p><p>输入嵌入与同维度的位置编码相加。</p><p class="small">PE(pos, 2i) = sin(pos / 10000^(2i/d_model))</p><p class="small">PE(pos, 2i+1) = cos(pos / 10000^(2i/d_model))</p><p class="label">逐位置前馈网络</p><p class="formula">FFN(x) = max(0, xW₁ + b₁)W₂ + b₂</p><p class="small">Base：512维输入，中间层2048维，输出512维。</p></div><p class="foot">来源：Vaswani 等，Attention Is All You Need，PDF第5–6页，§3.3、§3.5</p><p class="page">07</p></body></html>
