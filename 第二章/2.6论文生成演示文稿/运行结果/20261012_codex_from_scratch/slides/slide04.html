<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>html{background:#fff;}body{width:720pt;height:405pt;margin:0;padding:0;display:flex;position:relative;background:#fff;font-family:Arial,sans-serif;color:#17324d;}*{box-sizing:border-box;}h1{font-size:31pt;line-height:1.18;margin:0;}h2{font-size:21pt;line-height:1.3;margin:0;}p{font-size:18pt;line-height:1.35;margin:0 0 12pt;}ul{font-size:18pt;line-height:1.4;margin:0;padding-left:20pt;}li{margin-bottom:13pt;}img,.area{position:absolute;}img{object-fit:contain;}.label{font-size:16pt;color:#126d87;font-weight:bold;margin:0 0 9pt;}.lead{font-size:22pt;line-height:1.3;}.small{font-size:15pt;line-height:1.45;}.tiny{font-size:13pt;line-height:1.4;}.muted{color:#64748b;font-size:18pt;}.formula{font-size:20pt;line-height:1.35;}.metric{font-size:39pt;color:#126d87;font-weight:bold;line-height:1;margin-bottom:8pt;}.title{position:absolute;left:34pt;top:30pt;width:652pt;height:66pt;}.foot{position:absolute;left:34pt;top:379pt;width:620pt;font-size:10pt;color:#64748b;line-height:1;}.page{position:absolute;left:671pt;top:379pt;font-size:10pt;color:#64748b;line-height:1;}</style></head><body><div class="title"><h1>缩放点积注意力</h1></div><img src="../source_visuals/figure2_attention.png" style="left:74.83333333333331pt;top:130pt;width:275.33333333333337pt;height:154pt;"><div class="area" style="left:421pt;top:110pt;width:265pt;height:235pt;"><p class="formula">Attention(Q, K, V)</p><p class="formula">= softmax(QKᵀ / √dₖ)V</p><ul><li>Q与K点积得到匹配分数。</li><li>缩放后用softmax归一化。</li><li>权重对V加权求和。</li></ul></div><div class="area" style="left:35pt;top:304pt;width:355pt;height:44pt;"><p class="small">图左为单个注意力计算，图右为多个头的并行计算。</p></div><p class="foot">来源：Vaswani 等，Attention Is All You Need，PDF第4页，Figure 2</p><p class="page">04</p></body></html>
