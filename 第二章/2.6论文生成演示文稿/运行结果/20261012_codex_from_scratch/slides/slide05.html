<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>html{background:#fff;}body{width:720pt;height:405pt;margin:0;padding:0;display:flex;position:relative;background:#fff;font-family:Arial,sans-serif;color:#17324d;}*{box-sizing:border-box;}h1{font-size:31pt;line-height:1.18;margin:0;}h2{font-size:21pt;line-height:1.3;margin:0;}p{font-size:18pt;line-height:1.35;margin:0 0 12pt;}ul{font-size:18pt;line-height:1.4;margin:0;padding-left:20pt;}li{margin-bottom:13pt;}img,.area{position:absolute;}img{object-fit:contain;}.label{font-size:16pt;color:#126d87;font-weight:bold;margin:0 0 9pt;}.lead{font-size:22pt;line-height:1.3;}.small{font-size:15pt;line-height:1.45;}.tiny{font-size:13pt;line-height:1.4;}.muted{color:#64748b;font-size:18pt;}.formula{font-size:20pt;line-height:1.35;}.metric{font-size:39pt;color:#126d87;font-weight:bold;line-height:1;margin-bottom:8pt;}.title{position:absolute;left:34pt;top:30pt;width:652pt;height:66pt;}.foot{position:absolute;left:34pt;top:379pt;width:620pt;font-size:10pt;color:#64748b;line-height:1;}.page{position:absolute;left:671pt;top:379pt;font-size:10pt;color:#64748b;line-height:1;}</style></head><body><div class="title"><h1>多头注意力的维度</h1></div><div class="area" style="left:34pt;top:110pt;width:650pt;height:240pt;"><p class="lead">同一输入通过不同线性投影，进入多个注意力头。</p><p class="formula">MultiHead = Concat(head₁, …, headₕ)Wᴼ</p><p class="formula">Base：d_model = 512，h = 8，dₖ = dᵥ = 64</p><ul><li>每个头在不同的表示子空间计算注意力。</li><li>拼接各头后再投影，输出仍为512维。</li><li>这是原论文Base配置，不是本章Qwen3的16个Query头。</li></ul></div><p class="foot">来源：Vaswani 等，Attention Is All You Need，PDF第4–5页，§3.2.2</p><p class="page">05</p></body></html>
